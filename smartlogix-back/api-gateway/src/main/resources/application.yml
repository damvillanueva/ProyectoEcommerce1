server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: catalog-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/catalog/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: discount-service
          uri: lb://order-service
          predicates:
            - Path=/api/discounts/**
        - id: pos-service
          uri: lb://order-service
          predicates:
            - Path=/api/pos/**
        - id: post-sale-service
          uri: lb://order-service
          predicates:
            - Path=/api/returns/**
        - id: notification-service
          uri: lb://order-service
          predicates:
            - Path=/api/notifications/**
        - id: shipment-service
          uri: lb://shipment-service
          predicates:
            - Path=/api/shipments/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${SMARTLOGIX_CORS_ALLOWED_ORIGIN}
              - ${SMARTLOGIX_CORS_ALLOWED_ORIGIN_ALT}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowCredentials: true
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Correlation-ID
            exposedHeaders:
              - Set-Cookie
              - X-Correlation-ID

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${SMARTLOGIX_TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${SMARTLOGIX_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace_id=%X{traceId:-} span_id=%X{spanId:-} correlation_id=%X{correlationId:-} logger=%logger{36} message=%msg%n"
