server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: catalog-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/catalog/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: discount-service
          uri: lb://order-service
          predicates:
            - Path=/api/discounts/**
        - id: shipment-service
          uri: lb://shipment-service
          predicates:
            - Path=/api/shipments/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${SMARTLOGIX_CORS_ALLOWED_ORIGIN}
              - ${SMARTLOGIX_CORS_ALLOWED_ORIGIN_ALT}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowCredentials: true
            allowedHeaders:
              - Authorization
              - Content-Type
            exposedHeaders:
              - Set-Cookie

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
