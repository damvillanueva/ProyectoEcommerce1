server:
  port: 8761

spring:
  application:
    name: discovery-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${SMARTLOGIX_TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${SMARTLOGIX_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace_id=%X{traceId:-} span_id=%X{spanId:-} correlation_id=%X{correlationId:-} logger=%logger{36} message=%msg%n"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
