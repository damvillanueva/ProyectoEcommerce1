spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

smartlogix:
  seed:
    enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: SmartLogixAuthTestSecretWithAtLeast64CharactersAndNoProductionUse
