server:
  port: 8084

spring:
  application:
    name: auth-service
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true
  mail:
    host: ${SMARTLOGIX_MAIL_HOST:localhost}
    port: ${SMARTLOGIX_MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${SMARTLOGIX_MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${SMARTLOGIX_MAIL_STARTTLS:false}
    test-connection: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

smartlogix:
  frontend-url: ${SMARTLOGIX_FRONTEND_URL:http://127.0.0.1:5174}
  mail:
    from: ${SMARTLOGIX_MAIL_FROM:no-reply@smartlogix.local}
  auth:
    max-login-attempts: ${SMARTLOGIX_MAX_LOGIN_ATTEMPTS:5}
    lock-minutes: ${SMARTLOGIX_LOGIN_LOCK_MINUTES:15}
    email-verification-hours: ${SMARTLOGIX_EMAIL_VERIFICATION_HOURS:24}
    password-reset-minutes: ${SMARTLOGIX_PASSWORD_RESET_MINUTES:30}
    refresh-token-days: ${SMARTLOGIX_REFRESH_TOKEN_DAYS:14}
    refresh-cookie-secure: ${SMARTLOGIX_REFRESH_COOKIE_SECURE:false}
  seed:
    enabled: ${SMARTLOGIX_SEED_ENABLED:false}
    admin-password: ${SMARTLOGIX_SEED_ADMIN_PASSWORD}
    user-password: ${SMARTLOGIX_SEED_USER_PASSWORD}
    warehouse-password: ${SMARTLOGIX_SEED_WAREHOUSE_PASSWORD}
    customer-password: ${SMARTLOGIX_SEED_CUSTOMER_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${SMARTLOGIX_TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${SMARTLOGIX_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace_id=%X{traceId:-} span_id=%X{spanId:-} correlation_id=%X{correlationId:-} logger=%logger{36} message=%msg%n"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
