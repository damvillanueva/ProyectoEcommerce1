server:
  port: 8084

spring:
  application:
    name: auth-service
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true

# Configuración JWT
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}   # 1 hora

smartlogix:
  seed:
    enabled: ${SMARTLOGIX_SEED_ENABLED:true}
    admin-password: ${SMARTLOGIX_SEED_ADMIN_PASSWORD}
    user-password: ${SMARTLOGIX_SEED_USER_PASSWORD}
    warehouse-password: ${SMARTLOGIX_SEED_WAREHOUSE_PASSWORD}
    customer-password: ${SMARTLOGIX_SEED_CUSTOMER_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
