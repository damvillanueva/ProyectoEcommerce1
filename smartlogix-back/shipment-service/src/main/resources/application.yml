server:
  port: 8083

spring:
  application:
    name: shipment-service
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${SMARTLOGIX_TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${SMARTLOGIX_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace_id=%X{traceId:-} span_id=%X{spanId:-} correlation_id=%X{correlationId:-} logger=%logger{36} message=%msg%n"

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
