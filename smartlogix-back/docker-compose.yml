services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=smartlogix_admin
      - POSTGRES_PASSWORD=${SMARTLOGIX_DB_ADMIN_PASSWORD:?Defina SMARTLOGIX_DB_ADMIN_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_DB_AUTH_PASSWORD=${SMARTLOGIX_DB_AUTH_PASSWORD:?Defina SMARTLOGIX_DB_AUTH_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_DB_INVENTORY_PASSWORD=${SMARTLOGIX_DB_INVENTORY_PASSWORD:?Defina SMARTLOGIX_DB_INVENTORY_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_DB_ORDER_PASSWORD=${SMARTLOGIX_DB_ORDER_PASSWORD:?Defina SMARTLOGIX_DB_ORDER_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_DB_SHIPMENT_PASSWORD=${SMARTLOGIX_DB_SHIPMENT_PASSWORD:?Defina SMARTLOGIX_DB_SHIPMENT_PASSWORD en smartlogix-back/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - smartlogix-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    image: smartlogix/discovery-service:latest
    restart: unless-stopped
    environment:
      - SMARTLOGIX_TRACING_SAMPLE_RATE=${SMARTLOGIX_TRACING_SAMPLE_RATE:-1.0}
      - SMARTLOGIX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:8761:8761"

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"
    environment:
      - MP_MAX_MESSAGES=500

  zipkin:
    image: openzipkin/zipkin:3.6.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9411:9411"

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: smartlogix/auth-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartlogix_auth
      - SPRING_DATASOURCE_USERNAME=smartlogix_auth
      - SPRING_DATASOURCE_PASSWORD=${SMARTLOGIX_DB_AUTH_PASSWORD:?Defina SMARTLOGIX_DB_AUTH_PASSWORD en smartlogix-back/.env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en smartlogix-back/.env}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-900000}
      - SMARTLOGIX_SEED_ENABLED=${SMARTLOGIX_SEED_ENABLED:?Defina SMARTLOGIX_SEED_ENABLED en smartlogix-back/.env}
      - SMARTLOGIX_SEED_ADMIN_PASSWORD=${SMARTLOGIX_SEED_ADMIN_PASSWORD:?Defina SMARTLOGIX_SEED_ADMIN_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_SEED_USER_PASSWORD=${SMARTLOGIX_SEED_USER_PASSWORD:?Defina SMARTLOGIX_SEED_USER_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_SEED_WAREHOUSE_PASSWORD=${SMARTLOGIX_SEED_WAREHOUSE_PASSWORD:?Defina SMARTLOGIX_SEED_WAREHOUSE_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_SEED_CUSTOMER_PASSWORD=${SMARTLOGIX_SEED_CUSTOMER_PASSWORD:?Defina SMARTLOGIX_SEED_CUSTOMER_PASSWORD en smartlogix-back/.env}
      - SMARTLOGIX_MAIL_HOST=mailpit
      - SMARTLOGIX_MAIL_PORT=1025
      - SMARTLOGIX_FRONTEND_URL=${SMARTLOGIX_FRONTEND_URL:-http://127.0.0.1:5174}
      - SMARTLOGIX_REFRESH_COOKIE_SECURE=false
      - SMARTLOGIX_TRACING_SAMPLE_RATE=${SMARTLOGIX_TRACING_SAMPLE_RATE:-1.0}
      - SMARTLOGIX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 35s
    expose:
      - "8084"

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: smartlogix/inventory-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartlogix_inventory
      - SPRING_DATASOURCE_USERNAME=smartlogix_inventory
      - SPRING_DATASOURCE_PASSWORD=${SMARTLOGIX_DB_INVENTORY_PASSWORD:?Defina SMARTLOGIX_DB_INVENTORY_PASSWORD en smartlogix-back/.env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en smartlogix-back/.env}
      - SMARTLOGIX_TRACING_SAMPLE_RATE=${SMARTLOGIX_TRACING_SAMPLE_RATE:-1.0}
      - SMARTLOGIX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 35s
    expose:
      - "8081"

  shipment-service:
    build:
      context: .
      dockerfile: shipment-service/Dockerfile
    image: smartlogix/shipment-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartlogix_shipment
      - SPRING_DATASOURCE_USERNAME=smartlogix_shipment
      - SPRING_DATASOURCE_PASSWORD=${SMARTLOGIX_DB_SHIPMENT_PASSWORD:?Defina SMARTLOGIX_DB_SHIPMENT_PASSWORD en smartlogix-back/.env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en smartlogix-back/.env}
      - SMARTLOGIX_TRACING_SAMPLE_RATE=${SMARTLOGIX_TRACING_SAMPLE_RATE:-1.0}
      - SMARTLOGIX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 35s
    expose:
      - "8083"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: smartlogix/order-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartlogix_order
      - SPRING_DATASOURCE_USERNAME=smartlogix_order
      - SMARTLOGIX_MAIL_HOST=mailpit
      - SMARTLOGIX_MAIL_PORT=1025
      - SMARTLOGIX_FRONTEND_URL=${SMARTLOGIX_FRONTEND_URL:-http://127.0.0.1:5174}
      - SPRING_DATASOURCE_PASSWORD=${SMARTLOGIX_DB_ORDER_PASSWORD:?Defina SMARTLOGIX_DB_ORDER_PASSWORD en smartlogix-back/.env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en smartlogix-back/.env}
      - SMARTLOGIX_TRACING_SAMPLE_RATE=${SMARTLOGIX_TRACING_SAMPLE_RATE:-1.0}
      - SMARTLOGIX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    expose:
      - "8082"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: smartlogix/api-gateway:latest
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en smartlogix-back/.env}
      - SMARTLOGIX_CORS_ALLOWED_ORIGIN=${SMARTLOGIX_CORS_ALLOWED_ORIGIN:?Defina SMARTLOGIX_CORS_ALLOWED_ORIGIN en smartlogix-back/.env}
      - SMARTLOGIX_CORS_ALLOWED_ORIGIN_ALT=${SMARTLOGIX_CORS_ALLOWED_ORIGIN_ALT:?Defina SMARTLOGIX_CORS_ALLOWED_ORIGIN_ALT en smartlogix-back/.env}
      - SMARTLOGIX_TRACING_SAMPLE_RATE=${SMARTLOGIX_TRACING_SAMPLE_RATE:-1.0}
      - SMARTLOGIX_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    ports:
      - "127.0.0.1:8080:8080"

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - smartlogix-prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - smartlogix-grafana-data:/var/lib/grafana

volumes:
  smartlogix-postgres-data:
  smartlogix-prometheus-data:
  smartlogix-grafana-data:
